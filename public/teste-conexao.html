<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de conexão — PROMPT CLUB</title>
<style>body{background:#000;color:#fff;font:16px/1.5 system-ui;padding:24px}h1{font-size:22px}
li{margin:8px 0}.ok{color:#00FFAA}.erro{color:#ff6b6b}code{color:#A6A6A6}</style></head><body>
<h1>Teste de conexão</h1><ul id="r"><li>Executando…</li></ul>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
const r=document.getElementById('r');r.innerHTML='';
const add=(ok,t)=>{const li=document.createElement('li');li.className=ok?'ok':'erro';li.textContent=(ok?'✔ ':'✖ ')+t;r.appendChild(li)};
(async()=>{
 let sb;try{sb=await getSupabase();add(true,'Configuração recebida da Netlify')}catch(e){add(false,e.message);return}
 const c=await sb.from('categories').select('name').order('sort');
 if(c.error)add(false,'Leitura do banco falhou: '+c.error.message);
 else add(c.data.length===8,'Banco respondeu: '+c.data.length+' categorias (esperado: 8)');
 const prot=x=>x.error?/permission denied/i.test(x.error.message):(x.data||[]).length===0;
 const det=x=>x.error?' ('+x.error.message+')':' (resposta vazia)';
 const s=await sb.from('prompt_secrets').select('body');
 add(prot(s),'Textos pagos protegidos'+det(s));
 const w=await sb.from('wallets').select('*');
 add(prot(w),'Carteiras protegidas'+det(w));
 const u=await sb.rpc('unlock_prompt',{p_prompt_id:'00000000-0000-0000-0000-000000000000'});
 add(!!u.error,'Desbloqueio recusado sem login'+det(u));
})();
</script></body></html>
